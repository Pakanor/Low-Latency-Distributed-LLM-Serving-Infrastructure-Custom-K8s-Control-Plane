apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine-primary
  labels:
    app: llm-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-engine
  template:
    metadata:
      labels:
        app: llm-engine
    spec:
      containers:
      - name: engine
        image: docker.io/library/llm-baseline:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_NAME
          value: "HuggingFaceTB/SmolLM-135M-Instruct"
        resources:
          limits:
            cpu: "2"
            memory: "3Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10