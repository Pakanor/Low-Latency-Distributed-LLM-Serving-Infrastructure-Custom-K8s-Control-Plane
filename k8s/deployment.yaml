apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine-primary
  labels:
    app: llm-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-engine
  template:
    metadata:
      labels:
        app: llm-engine
    spec:
      containers:
      - name: engine
        image: llm-baseline:v1
        imagePullPolicy: Never 
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: "3Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-engine-service
spec:
  type: ClusterIP
  selector:
    app: llm-engine
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: llm-engine-service
            port:
              number: 80