apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine-primary
  labels:
    app: llm-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-engine
  template:
    metadata:
      labels:
        app: llm-engine
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: engine
        image: docker.io/library/llm-baseline:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_NAME
          value: "HuggingFaceTB/SmolLM-135M-Instruct"
        - name: LLM_DEVICE
          value: "cpu"
        - name: LLM_DTYPE
          value: "fp32"
        - name: REQUEST_TIMEOUT_SECONDS
          value: "300"
        resources:
          limits:
            cpu: "2"
            memory: "3Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: hf-cache-storage
          mountPath: /root/.cache/huggingface
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          failureThreshold: 3
      volumes:
      - name: hf-cache-storage
        persistentVolumeClaim:
          claimName: hf-model-cache-pvc